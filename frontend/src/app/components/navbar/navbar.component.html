<!-- Barra Superior de Navegação -->
<nav class="navbar navbar-expand-lg nav-custom px-3 px-lg-4 py-2 mb-4">
  <div class="container-fluid max-w-container">
    
    <!-- Logo e Marca -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/dashboard">
      <div class="logo-icon d-flex align-items-center justify-content-center">
        <i class="bi bi-shield-shaded text-cyan fs-4"></i>
      </div>
      <div>
        <span class="fw-bold text-white brand-title">APEX <span class="text-cyan">DETAILING</span></span>
      </div>
    </a>

    <!-- Botão Mobile -->
    <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <i class="bi bi-list fs-2"></i>
    </button>

    <!-- Menu de Navegação -->
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
        <li class="nav-item">
          <a class="nav-link nav-link-custom px-3 py-2 rounded-3" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-speedometer2 me-1"></i> Painel Geral
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom px-3 py-2 rounded-3" routerLink="/clientes" routerLinkActive="active" id="nav-clientes">
            <i class="bi bi-people me-1"></i> Clientes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-custom px-3 py-2 rounded-3" routerLink="/agendamentos" routerLinkActive="active" id="nav-agendamentos">
            <i class="bi bi-calendar2-week me-1"></i> Agendamentos & Boxes
          </a>
        </li>
      </ul>

      <!-- Usuário Logado e Logout -->
      <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
        <div class="user-chip d-flex align-items-center gap-2 px-3 py-1 rounded-pill">
          <i class="bi bi-person-circle text-cyan fs-5"></i>
          <span class="fw-semibold text-white small" id="user-display-name">{{ obterNomeUsuario() }}</span>
        </div>

        <button (click)="sair()" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1 py-1 px-3 rounded-3" id="btn-logout" title="Encerrar Sessão">
          <i class="bi bi-box-arrow-right"></i>
          <span>Sair</span>
        </button>
      </div>
    </div>

  </div>
</nav>
